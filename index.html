<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kevin Design - Jersey Designer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
  body{background:#fff;color:#111}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #eee}
  .logo{font-weight:900;font-size:18px;letter-spacing:-1px}
  .tag{font-size:10px;letter-spacing:2px;color:#888;font-weight:700}
  .hero{display:flex;gap:30px;align-items:center;padding:50px 0 30px;flex-wrap:wrap}
  .photo-wrap{text-align:center}
  .photo{width:140px;height:140px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:40px;font-weight:900;overflow:hidden;border:3px solid #111}
  .photo img{width:100%;height:100%;object-fit:cover}
  .photo-note{margin-top:8px;font-size:9px;letter-spacing:2px;color:#999;font-weight:700}
  h1{font-size:32px;line-height:1.1;font-weight:900;letter-spacing:-1px}
  h1 span{color:#FF4D00}
  .skills{margin-top:12px;font-size:11px;letter-spacing:2px;color:#666;font-weight:700}
  .desc{margin-top:10px;color:#444;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding-bottom:40px}
  .card{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff}
  .card-top{height:130px;display:grid;place-items:center}
  .jersey{width:66px;height:60px;background:#fff;border-radius:6px 6px 10px 10px;position:relative;display:grid;place-items:center;font-weight:900;font-size:11px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .card-bottom{padding:10px 12px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
  footer{border-top:1px solid #eee;padding:18px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#888;flex-wrap:wrap;gap:10px}
  .btn{background:#111;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:700;letter-spacing:1px}
</style>
</head>
